name: Release

on:
  push:
    tags: ["release/**"]

permissions: {}

concurrency:
  # One release per tag. Never cancel a publish in progress.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  publish:
    name: Publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history and tags: the ancestry check needs them.
          fetch-depth: 0
          # Exception to the no-persisted-credentials rule: the private repository needs the
          # token for `git fetch` below. This job runs only on a release tag, inside the
          # release environment.
          persist-credentials: true

      - name: Require the tag on main
        run: |
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME is not on origin/main"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Join the tailnet
        if: vars.TS_CI_CLIENT_ID != ''
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_TAILNET_HOST }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # MIT provider over actions/cache: no commercial cache service and no billing surprise.
          cache-provider: basic
          # Consume the caches built on main; do not add entries from a tag.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          # The wrapper JAR is checked against the published checksums before Gradle runs.
          validate-wrappers: true

      - name: Check the release version
        env:
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: ci-read
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_CI_READ_TOKEN }}
        run: ./gradlew check -Pversion.requireRelease=true

      - name: Publish the release
        env:
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: release-publish
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_RELEASE_TOKEN }}
        run: ./gradlew publish

      - name: Publish to the Gradle Plugin Portal
        if: vars.PORTAL_PUBLISH == 'true'
        env:
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: ci-read
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_CI_READ_TOKEN }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins
