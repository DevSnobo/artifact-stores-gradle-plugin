name: Release

on:
  push:
    tags: ["release/**"]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Join the tailnet
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_TAILNET_HOST }}
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check the release version
        env:
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: ci-read
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_CI_READ_TOKEN }}
        run: ./gradlew check -Pversion.requireRelease=true
      - name: Publish the release
        env:
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: release-publish
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_RELEASE_TOKEN }}
        run: ./gradlew publish
