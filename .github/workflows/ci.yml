name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  # One run per ref. A new PR push cancels the old run; a main push does not cancel a release run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for Gradle and tests to find.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT provider over actions/cache: no commercial cache service and no billing surprise.
          cache-provider: basic
          # Branches restore; only the default branch writes. Release tags stay read-only.
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          # Required before setup-gradle stores configuration-cache data.
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          # The wrapper JAR is checked against the published checksums before Gradle runs.
          validate-wrappers: true

      - name: Configuration cache reuse
        run: |
          set -euo pipefail
          ./gradlew help --configuration-cache -Dorg.gradle.configuration-cache.problems=fail
          output=$(./gradlew help --configuration-cache -Dorg.gradle.configuration-cache.problems=fail)
          printf '%s\n' "$output"
          grep -q "Reusing configuration cache." <<<"$output"

      - name: Verify
        run: ./gradlew check

      - name: Check lockfiles are current
        run: |
          ./gradlew resolveAndLockAll --write-locks
          git diff --exit-code -- '**/gradle.lockfile' 'gradle.lockfile'

  test-gradle-version:
    name: TestKit on Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported line, on the minimum JVM that runs Gradle.
          - gradle: "8.14.7"
            java: "17"
          # Current stable line, on the production JVM.
          - gradle: "9.9.1"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Run the TestKit suite
        env:
          ARTIFACT_STORE_TEST_GRADLE_VERSION: ${{ matrix.gradle }}
        run: ./gradlew test

  windows:
    name: Windows (JDK 21)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Check
        run: ./gradlew check

  portal-validate:
    name: Plugin Portal validation
    # Same-repository PRs only: fork PRs cannot see the portal credentials.
    # Validation never uploads, so it does not depend on the PORTAL_PUBLISH switch.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Validate the portal publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins --validate-only
