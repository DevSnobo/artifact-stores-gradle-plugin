name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Join the tailnet
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_TAILNET_HOST }}
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Verify
        env:
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: ci-read
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_CI_READ_TOKEN }}
        run: ./gradlew check

  test-gradle-version:
    name: TestKit on Gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.14.3", "9.7.1"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Join the tailnet
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_TAILNET_HOST }}
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run the TestKit suite
        env:
          REPOSILITE_TEST_GRADLE_VERSION: ${{ matrix.gradle }}
          ORG_GRADLE_PROJECT_reposiliteUrl: ${{ vars.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_reposilitePublisher: ci-read
          ORG_GRADLE_PROJECT_reposiliteToken: ${{ secrets.REPOSILITE_CI_READ_TOKEN }}
        run: ./gradlew test --rerun
