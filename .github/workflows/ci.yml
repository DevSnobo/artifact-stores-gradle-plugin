name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
      GRADLE_PUBLISH_KEY:
        required: false
      GRADLE_PUBLISH_SECRET:
        required: false

permissions: {}

env:
  # The local Gradle build cache is enabled only in CI. Its only store is the GitHub Actions
  # cache service; there is no remote build cache.
  GRADLE_BUILD_CACHE_DIR: ${{ github.workspace }}/.gradle/build-cache

concurrency:
  # One run per ref. A new PR push cancels the old run; a main push does not cancel a release run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for Gradle and tests to find.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Prepare the Gradle build cache directory
        id: build-cache-dir
        run: mkdir -p .gradle/build-cache

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-${{ runner.os }}-verify-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-verify-

      - name: Configuration cache reuse
        run: |
          set -euo pipefail
          ./gradlew help --configuration-cache -Dorg.gradle.configuration-cache.problems=fail
          output=$(./gradlew help --configuration-cache -Dorg.gradle.configuration-cache.problems=fail)
          printf '%s\n' "$output"
          grep -q "Reusing configuration cache." <<<"$output"

      - name: Verify
        run: ./gradlew check --warning-mode=fail

      - name: Check lockfiles are current
        run: |
          ./gradlew resolveAndLockAll --write-locks
          git diff --exit-code -- '**/gradle.lockfile' 'gradle.lockfile'

      - name: Save the Gradle build cache
        if: always() && steps.build-cache-dir.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-${{ runner.os }}-verify-${{ github.run_id }}-${{ github.run_attempt }}

  test-gradle-version:
    name: TestKit on Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported line, on the minimum JVM that runs Gradle.
          - gradle: "8.14.7"
            java: "17"
          # Current stable line, on the production JVM.
          - gradle: "9.9.1"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Prepare the Gradle build cache directory
        id: build-cache-dir
        run: mkdir -p .gradle/build-cache

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-${{ runner.os }}-testkit-${{ matrix.gradle }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-testkit-${{ matrix.gradle }}-

      - name: Run the TestKit suite
        env:
          ARTIFACT_STORE_TEST_GRADLE_VERSION: ${{ matrix.gradle }}
        run: ./gradlew test

      - name: Save the Gradle build cache
        if: always() && steps.build-cache-dir.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-${{ runner.os }}-testkit-${{ matrix.gradle }}-${{ github.run_id }}-${{ github.run_attempt }}

  windows:
    name: Windows (JDK 21)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Prepare the Gradle build cache directory
        id: build-cache-dir
        run: mkdir -p .gradle/build-cache

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-${{ runner.os }}-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-windows-

      - name: Check
        run: ./gradlew check

      - name: Save the Gradle build cache
        if: always() && steps.build-cache-dir.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: gradle-build-cache-${{ runner.os }}-windows-${{ github.run_id }}-${{ github.run_attempt }}

  portal-validate:
    name: Plugin Portal validation
    # Same-repository PRs only: fork PRs cannot see the portal credentials.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PORTAL_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Validate the portal publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        # A fixed non-SNAPSHOT version: the Portal rejects SNAPSHOT metadata, and validation never uploads.
        run: ./gradlew publishPlugins --validate-only -Pversion=0.0.0-validation

  dogfood-version:
    name: Dogfood version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the dogfood version with the Plugin Portal
        env:
          DOGFOOD_VERSION_OVERRIDE: ${{ vars.DOGFOOD_VERSION_OVERRIDE }}
        run: |
          set -euo pipefail
          declared=$(sed -n 's/.*id("net.snobo.artifact-stores") version "\([^"]*\)".*/\1/p' settings.gradle.kts)
          if [ -z "$declared" ]; then
            echo "::error::settings.gradle.kts does not declare the net.snobo.artifact-stores plugin version"
            exit 1
          fi
          metadata=$(curl -fsS --retry 3 https://plugins.gradle.org/m2/net/snobo/artifact-stores/net.snobo.artifact-stores.gradle.plugin/maven-metadata.xml)
          # Pre-releases are not dogfood candidates. Set the repository variable
          # DOGFOOD_VERSION_OVERRIDE to the version of a release PR that intentionally applies
          # the version it is about to publish.
          stable=$(printf '%s\n' "$metadata" | grep -o '<version>[^<]*</version>' | sed 's:<[^>]*>::g' | grep -v -- '-' | tail -n 1)
          if [ -z "$stable" ]; then
            echo "::error::Could not read a stable version from the Plugin Portal metadata"
            exit 1
          fi
          if [ -n "$DOGFOOD_VERSION_OVERRIDE" ] && [ "$declared" = "$DOGFOOD_VERSION_OVERRIDE" ]; then
            echo "The build applies $declared, allowed by DOGFOOD_VERSION_OVERRIDE."
            exit 0
          fi
          if [ "$declared" != "$stable" ]; then
            echo "::error::The build applies net.snobo.artifact-stores $declared but the latest stable Plugin Portal release is $stable. Bump the dogfood version."
            exit 1
          fi
          echo "Dogfood version $declared is the latest stable Plugin Portal release."

  api-validation:
    name: API compatibility
    # Binary compatibility validation uses allprojects and cannot run with Isolated Projects enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Check the public API
        run: ./gradlew apiCheck -Dorg.gradle.isolated-projects=false
