name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to catch secrets committed before this workflow existed.
    - cron: "0 4 * * 1"

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the PR comment. Drop this and set GITLEAKS_ENABLE_COMMENTS
      # to "false" below if the job should have no write permission at all.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan needs it.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fork PRs get a read-only token, so the comment is skipped there.
          # GITLEAKS_ENABLE_COMMENTS: "false"
          # Required only for repositories owned by an organization,
          # not for personal accounts. Uncomment when needed.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
